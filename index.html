<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PulseBPM - Audio BPM & Tempo Detector</title>
    <meta name="description" content="Professional real-time BPM detector, audio waveform beat-grid visualizer, tap tempo, musical key detection, and AI DJ insights." />
    <meta property="og:title" content="PulseBPM - Audio BPM & Tempo Detector" />
    <meta property="og:description" content="Professional real-time BPM detector, audio waveform beat-grid visualizer, tap tempo, musical key detection, and AI DJ insights." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#020617" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('beatpulse_theme') || 'dark';
          var isDark =
            saved === 'dark' ||
            (saved === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.style.colorScheme = 'light';
          }
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute('content', isDark ? '#020617' : '#f8fafc');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased selection:bg-emerald-500 selection:text-slate-950 min-h-screen transition-colors">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
