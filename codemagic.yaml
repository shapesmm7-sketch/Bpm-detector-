workflows:
  android-release-workflow:
    name: Build Android Release APK & AAB
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - Android signing
      node: 22.14.0
      java: 21
      vars:
        NODE_OPTIONS: "--experimental-strip-types"
    triggering:
      events:
        - push
        - tag
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
          source: true
    scripts:
      - name: Install dependencies
        script: |
          npm install --include=optional --legacy-peer-deps
      - name: Build web assets and sync to native Android
        script: |
          npm run build
          npx cap sync android
      - name: Prepare Android signing configuration
        script: |
          if [ -n "${CM_KEYSTORE:-}" ] && [ -z "${CM_KEYSTORE_PATH:-}" ]; then
            if [ "$(uname -s)" = "Darwin" ]; then
              printf '%s' "$CM_KEYSTORE" | tr -d '[:space:]' | base64 -D > /tmp/cm-release.keystore
            else
              printf '%s' "$CM_KEYSTORE" | tr -d '[:space:]' | base64 -d > /tmp/cm-release.keystore
            fi
            if [ ! -s /tmp/cm-release.keystore ]; then
              echo "ERROR: Decoded CM_KEYSTORE is empty. Check the base64 string in the 'Android signing' group."
              exit 1
            fi
            echo "CM_KEYSTORE_PATH=/tmp/cm-release.keystore" >> "$CM_ENV"
            echo "Using decoded CM_KEYSTORE from Codemagic 'Android signing' group."
            keytool -list -v -keystore /tmp/cm-release.keystore -storepass "$CM_KEYSTORE_PASSWORD" | grep -E "Alias name:|SHA1:|SHA256:" || true
          elif [ -n "${CM_KEYSTORE_PATH:-}" ] && [ -f "${CM_KEYSTORE_PATH}" ]; then
            echo "Using keystore at CM_KEYSTORE_PATH."
            keytool -list -v -keystore "$CM_KEYSTORE_PATH" -storepass "$CM_KEYSTORE_PASSWORD" | grep -E "Alias name:|SHA1:|SHA256:" || true
          elif [ -f "android/app/movibe.keystore" ] && [ -n "${CM_KEYSTORE_PASSWORD:-}" ] && [ -n "${CM_KEY_ALIAS:-}" ] && [ -n "${CM_KEY_PASSWORD:-}" ]; then
            echo "CM_KEYSTORE_PATH=$(pwd)/android/app/movibe.keystore" >> "$CM_ENV"
            echo "Using existing android/app/movibe.keystore with Codemagic signing credentials."
            keytool -list -v -keystore android/app/movibe.keystore -storepass "$CM_KEYSTORE_PASSWORD" | grep -E "Alias name:|SHA1:|SHA256:" || true
          else
            if [ ! -f android/app/debug.keystore ]; then
              echo "WARNING: No persistent keystore configured (CM_KEYSTORE / CM_KEYSTORE_PATH / android/app/movibe.keystore)."
              echo "Generating temporary debug.keystore (its SHA-1 changes on every clean build)..."
              keytool -genkeypair \
                -keystore android/app/debug.keystore \
                -storetype PKCS12 \
                -alias androiddebugkey \
                -storepass android \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
            echo "Using fallback android/app/debug.keystore:"
            keytool -list -v -keystore android/app/debug.keystore -storepass android | grep -E "SHA1:|SHA256:" || true
          fi
      - name: Build Android Release APK and AAB
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease
      - name: Print Release APK Signing SHA-1 & SHA-256 Fingerprints
        script: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          SDK_DIR="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER=$(find "$SDK_DIR/build-tools" -maxdepth 2 -name apksigner 2>/dev/null | sort | tail -n 1 || true)
          if [ -n "$APKSIGNER" ] && [ -f "$APK_PATH" ]; then
            "$APKSIGNER" verify --print-certs "$APK_PATH"
          else
            keytool -printcert -jarfile "$APK_PATH" || true
          fi
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
      - android/app/build/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - shapesmm7@gmail.com
        notify:
          success: true
          failure: true
