workflows:
  android-debug-workflow:
    name: Build Android Debug APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: 22.14.0
      java: 21
    triggering:
      events:
        - push
        - tag
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
          source: true
    scripts:
      - name: Install dependencies
        script: |
          npm ci || npm install
      - name: Build web assets and sync to native Android
        script: |
          npm run build
          npx cap sync android
      - name: Build Android Debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          - shapesmm7@gmail.com
        notify:
          success: true
          failure: true
